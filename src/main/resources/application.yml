server:
  port: 8082 # Puerto distinto para las órdenes

spring:
  datasource:
    url: "${ORACLE_DB_URL:jdbc:oracle:thin:@//digitalfix-rds.c2xes83rw6s6.us-east-1.rds.amazonaws.com:1521/DIGIFIX}"
    driverClassName: oracle.jdbc.OracleDriver
    username: ${ORACLE_DB_USER:admin}
    password: "${ORACLE_DB_PASSWORD:Admin#2026*}"
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:39092,localhost:49092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5