server:
  port: 8082 # Puerto distinto para las órdenes

spring:
  datasource:
    url: "${ORACLE_DB_URL:jdbc:oracle:thin:@//digitalfix-rds.c2xes83rw6s6.us-east-1.rds.amazonaws.com:1521/DIGIFIX}"
    driverClassName: oracle.jdbc.OracleDriver
    username: ${ORACLE_DB_USER:admin}
    password: "${ORACLE_DB_PASSWORD:Admin#2026*}"
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
